{% extends "base.html" %}
{% block title %}Pagina no encontrada{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold" style="color: var(--accent-color, #0d6efd);">404</h1>
    <h3>Pagina no encontrada</h3>
    <p class="text-muted">La pagina que buscas no existe o fue movida.</p>
    <a class="btn text-white" style="background-color: var(--accent-color, #0d6efd);" href="{{ url_for('auth.login') }}">Volver al inicio</a>
</div>
{% endblock %}
